name: Build debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extraer ZIP si hace falta y localizar proyecto
        id: find
        run: |
          # Si el proyecto no está suelto, descomprime el ZIP que haya en el repo
          if [ -z "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)" ]; then
            ZIP=$(find . -iname "*.zip" -not -path './.git/*' | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "No hay settings.gradle.kts ni ningún .zip en el repositorio"
              find . -maxdepth 3 -not -path './.git/*' | head -50
              exit 1
            fi
            echo "Extrayendo: $ZIP"
            mkdir -p "$RUNNER_TEMP/src"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/src"
            FILE=$(find "$RUNNER_TEMP/src" -name settings.gradle.kts | head -n 1)
          else
            FILE=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          fi
          if [ -z "$FILE" ]; then
            echo "El ZIP no contiene settings.gradle.kts"
            exit 1
          fi
          DIR=$(cd "$(dirname "$FILE")" && pwd)
          echo "Proyecto en: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK debug
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - name: Copiar APK
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apk-out"
          cp ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/apk-out/"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: JullTV-debug-apk
          path: apk-out/*.apk
          if-no-files-found: error
